# Firebase App Hosting runtime config — see scripts/deploy at the repo root.
#
# NEXT_PUBLIC_* values are safe to commit (see .env.local.example) and must
# be present at BUILD time since Next.js inlines them into the client
# bundle. FIREBASE_SERVICE_ACCOUNT_KEY is intentionally absent: App Hosting
# runs on Firebase's own infrastructure, so src/lib/firebase-admin.ts's
# Application Default Credentials fallback covers it with no key needed.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyANyJYdqluEmdZ6Ys4DNcQUhC4Or-m7RMI"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "random-knowledge-ea232.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "random-knowledge-ea232"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "random-knowledge-ea232.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "900940305507"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:900940305507:web:0043852fa804d0e0a41456"
    availability: [BUILD, RUNTIME]
  - variable: OPENAI_MODEL
    value: "gpt-4o-mini"
    availability: [RUNTIME]
  # Set the value once via: firebase apphosting:secrets:set openai-api-key
  - variable: OPENAI_API_KEY
    secret: openai-api-key
    availability: [RUNTIME]

# Firebase App Hosting runtime config — see scripts/deploy at the repo root.
#
# The backend's root directory is the repo root (not apps/web) because the
# npm workspace lockfile lives here and apps/web depends on the
# @random-knowledge/shared workspace package.
scripts:
  # App Hosting rewrites the root package.json and drops its "workspaces"
  # field, so the buildpack's own `npm ci` installs nothing for apps/web.
  # Restore the field and reinstall before building.
  buildCommand: npm pkg set 'workspaces[0]=apps/*' 'workspaces[1]=packages/*' && npm ci --include=dev && npm --prefix apps/web run build